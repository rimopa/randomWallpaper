name: Build PowerShell EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install ps2exe module
      shell: pwsh
      run: |
        Install-Module -Name ps2exe -Force -Scope CurrentUser

    - name: Generate EXE
      shell: pwsh
      run: |
        Invoke-ps2exe ./randomWallpaper.ps1 ./randomWallpaper.exe -noConsole

    - name: Restore signing certificate from GitHub Secret
      shell: pwsh
      run: |
        # Decode base64 cert back into PFX file
        [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\rimopaCert.pfx", [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_BASE64 }}"))

    - name: Sign the EXE
      shell: pwsh
      run: |
        $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
        $signtool = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1

        if (-not $signtool) {
            Write-Error "signtool.exe not found!"
            exit 1
        }

        & $signtool.FullName sign /f "$env:GITHUB_WORKSPACE\rimopaCert.pfx" /p "${{ secrets.SIGNING_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$env:GITHUB_WORKSPACE\randomWallpaper.exe"

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: wallpaper-exe
        path: randomWallpaper.exe

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: "randomWallpaper.exe randomWallpaper.ps1"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
